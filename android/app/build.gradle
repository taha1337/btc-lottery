plugins { id 'com.android.application' }

android {
    namespace 'com.taha1337.btclottery'
    compileSdk 36

    defaultConfig {
        applicationId 'com.taha1337.btclottery'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
